<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffc85e"/>
      <stop offset="0.55" stop-color="#f6b042"/>
      <stop offset="1" stop-color="#e8893a"/>
    </linearGradient>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="488" x2="0" y2="664">
      <stop offset="0" stop-color="#5ce1e6"/>
      <stop offset="1" stop-color="#2ec4b6"/>
    </linearGradient>
  </defs>
  <!-- Locket's icon (render: resvg docs/icon.svg icon.png). forEach developer palette. -->
  <!-- plate -->
  <rect x="34" y="34" width="956" height="956" rx="214" fill="#131820" stroke="#1e2533" stroke-width="12"/>
  <!-- chain: two dashed teal strands up to the plate's top -->
  <path d="M470 236 C 420 180, 360 150, 300 140" fill="none" stroke="#2bada4" stroke-width="22" stroke-linecap="round" stroke-dasharray="30 34"/>
  <path d="M554 236 C 604 180, 664 150, 724 140" fill="none" stroke="#2bada4" stroke-width="22" stroke-linecap="round" stroke-dasharray="30 34"/>
  <!-- bail ring -->
  <circle cx="512" cy="258" r="44" fill="none" stroke="#f3ece2" stroke-width="30"/>
  <rect x="490" y="290" width="44" height="52" rx="14" fill="#f3ece2"/>
  <!-- locket body -->
  <circle cx="512" cy="568" r="240" fill="url(#amber)"/>
  <!-- the seam where it opens -->
  <circle cx="512" cy="568" r="190" fill="none" stroke="#f3ece2" stroke-width="18"/>
  <!-- keyhole on a dark inset -->
  <circle cx="512" cy="568" r="134" fill="#131820"/>
  <g fill="url(#teal)">
    <circle cx="512" cy="536" r="46"/>
    <path d="M484 552 L540 552 L560 652 Q562 664 550 664 L474 664 Q462 664 464 652 Z"/>
  </g>
</svg>
